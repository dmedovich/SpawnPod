name: Check and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
      - run: make check
      - run: go test -race -short ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
      - name: Verify tag matches declared version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: test "$RELEASE_VERSION" = "$(cat VERSION)"
      - run: ./scripts/release.sh
      - name: Prepare OCI exporter
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
      - run: ./scripts/release-image.sh
      - name: Verify package and publish candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cd "dist/$RELEASE_VERSION"
          sha256sum -c SHA256SUMS
          cd ../..
          gh release create "$RELEASE_VERSION" --verify-tag --prerelease \
            --title "SpawnPod $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_VERSION.md" \
            "dist/$RELEASE_VERSION/spawnpod_${RELEASE_VERSION}_linux_amd64.tar.gz" \
            "dist/$RELEASE_VERSION/spawnpod_${RELEASE_VERSION}_linux_amd64.oci.tar" \
            "dist/$RELEASE_VERSION/IMAGE_DIGEST" \
            "dist/$RELEASE_VERSION/SHA256SUMS"
