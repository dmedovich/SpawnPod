name: Check and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
      - run: make check
      - run: go test -race -short ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
      - name: Prepare disposable K3s/Forgejo test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman python3-yaml zstd
      - name: Verify RC6 upgrade, network isolation and real Runner profiles
        run: bash tests/integration/upgrade-ci.sh
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
      - name: Verify tag matches declared version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: test "$RELEASE_VERSION" = "$(cat VERSION)"
      - name: Record source commit
        id: source
        run: printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build Linux archives
        run: |
          ./scripts/release.sh "$GITHUB_REF_NAME" amd64
          ./scripts/release.sh "$GITHUB_REF_NAME" arm64
      - name: Prepare OCI exporter
        run: |
          if ! command -v podman >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
      - run: ./scripts/release-image.sh
      - name: Verify archives and checksums
        run: bash ./scripts/verify-release.sh "$GITHUB_REF_NAME"
      - name: Generate amd64 SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist/${{ github.ref_name }}/spawnpod_${{ github.ref_name }}_linux_amd64
          format: spdx-json
          output-file: dist/${{ github.ref_name }}/spawnpod_${{ github.ref_name }}_linux_amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate arm64 SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist/${{ github.ref_name }}/spawnpod_${{ github.ref_name }}_linux_arm64
          format: spdx-json
          output-file: dist/${{ github.ref_name }}/spawnpod_${{ github.ref_name }}_linux_arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: Publish multi-arch runtime image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: dist/${{ github.ref_name }}
          file: deploy/release/multiarch.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/dmedovich/spawnpod:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ steps.source.outputs.revision }}
          provenance: mode=max
          sbom: true
      - name: Record published digest and finish checksums
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'ghcr.io/dmedovich/spawnpod@%s\n' "$IMAGE_DIGEST" > "dist/$GITHUB_REF_NAME/GHCR_DIGEST"
          cd "dist/$GITHUB_REF_NAME"
          sha256sum ./*.spdx.json GHCR_DIGEST >> SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: sigstore/cosign-installer@v4.1.2
      - name: Sign and verify the release image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          image="ghcr.io/dmedovich/spawnpod@$IMAGE_DIGEST"
          cosign sign --yes "$image"
          cosign verify "$image" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-checksums: dist/${{ github.ref_name }}/SHA256SUMS
      - name: Attest checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ github.ref_name }}/SHA256SUMS
      - name: Attest amd64 archive SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ github.ref_name }}/spawnpod_${{ github.ref_name }}_linux_amd64.tar.gz
          sbom-path: dist/${{ github.ref_name }}/spawnpod_${{ github.ref_name }}_linux_amd64.spdx.json
      - name: Attest arm64 archive SBOM
        uses: actions/attest@v4
        with:
          subject-path: dist/${{ github.ref_name }}/spawnpod_${{ github.ref_name }}_linux_arm64.tar.gz
          sbom-path: dist/${{ github.ref_name }}/spawnpod_${{ github.ref_name }}_linux_arm64.spdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          cd "dist/$RELEASE_VERSION"
          sha256sum -c SHA256SUMS
          cd ../..
          prerelease=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$RELEASE_VERSION" --verify-tag "${prerelease[@]}" \
            --title "SpawnPod $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_VERSION.md" \
            "dist/$RELEASE_VERSION/spawnpod_${RELEASE_VERSION}_linux_amd64.tar.gz" \
            "dist/$RELEASE_VERSION/spawnpod_${RELEASE_VERSION}_linux_arm64.tar.gz" \
            "dist/$RELEASE_VERSION/spawnpod_${RELEASE_VERSION}_linux_amd64.spdx.json" \
            "dist/$RELEASE_VERSION/spawnpod_${RELEASE_VERSION}_linux_arm64.spdx.json" \
            "dist/$RELEASE_VERSION/spawnpod_${RELEASE_VERSION}_linux_amd64.oci.tar" \
            "dist/$RELEASE_VERSION/IMAGE_DIGEST" \
            "dist/$RELEASE_VERSION/GHCR_DIGEST" \
            "dist/$RELEASE_VERSION/SHA256SUMS"
