# Register an official Forgejo Runner v13.1.0 before creating this Secret.
# Replace the URL, registration credentials, and approved job image digest.
runner:
  capacity: 1
  timeout: 30m
  shutdown_timeout: 30s
  labels:
    - "spawnpod:spawnpod://registry.example.com/ci-base@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
cache:
  enabled: false
plugins:
  spawnpod:
    address: unix:///run/spawnpod/private/backend.sock
    options:
      profile: default
server:
  connections:
    forgejo:
      url: https://forgejo.example.com/
      uuid: REPLACE_WITH_REGISTERED_UUID
      token: REPLACE_WITH_REGISTERED_SHARED_SECRET
