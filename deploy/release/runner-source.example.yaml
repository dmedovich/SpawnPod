# Two-profile configuration verified locally with official Runner v13.1.0.
# Repeat network acceptance on the target CNI before production use.
# Replace image digests and private registration values; store as mode 0600.
runner:
  capacity: 1
  timeout: 30m
  shutdown_timeout: 30s
  labels:
    - "spawnpod:spawnpod://registry.example.com/ci-base@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
    - "spawnpod-source:spawnpod-source://registry.example.com/ci-base@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
cache:
  enabled: false
plugins:
  spawnpod:
    address: unix:///run/spawnpod/private/backend.sock
    options:
      profile: default
  spawnpod-source:
    address: unix:///run/spawnpod/private/backend.sock
    options:
      profile: source
server:
  connections:
    forgejo:
      url: https://forgejo.example.com/
      uuid: REPLACE_WITH_REGISTERED_UUID
      token: REPLACE_WITH_REGISTERED_SHARED_SECRET
