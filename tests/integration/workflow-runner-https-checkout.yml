name: SpawnPod Runner HTTPS checkout
on: workflow_dispatch
jobs:
  https-checkout:
    runs-on: spawnpod
    timeout-minutes: 10
    defaults:
      run:
        shell: sh
        working-directory: /workspace
    steps:
      - name: Clone a small public repository through the source proxy
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git clone --depth 1 https://github.com/octocat/Hello-World.git source-checkout
          test -s source-checkout/README
          git -C source-checkout remote get-url origin | grep -Fx https://github.com/octocat/Hello-World.git
