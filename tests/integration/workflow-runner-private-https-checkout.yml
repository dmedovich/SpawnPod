name: SpawnPod Runner private Forgejo HTTPS checkout
on: workflow_dispatch
jobs:
  private-https-checkout:
    runs-on: spawnpod
    timeout-minutes: 10
    env:
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/spawnpod-local.crt
      GIT_SSL_CAINFO: /etc/ssl/certs/ca-certificates.crt
    steps:
      - name: Checkout the private Forgejo repository over HTTPS
        uses: actions/checkout@v4
        with:
          github-server-url: https://forgejo.local:3443
          repository: spawnpod-admin/spawnpod-smoke
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify checked out files and remote
        shell: sh
        run: |
          test -f "$GITHUB_WORKSPACE/.forgejo/workflows/workflow-runner-private-https-checkout.yml"
          git -C "$GITHUB_WORKSPACE" remote get-url origin | grep -Fx https://forgejo.local:3443/spawnpod-admin/spawnpod-smoke
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse --is-shallow-repository)" = true
          node --version
          git --version
