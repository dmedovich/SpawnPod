name: SpawnPod egress isolation
on: workflow_dispatch
jobs:
  deny-api-egress:
    runs-on: spawnpod
    timeout-minutes: 10
    defaults:
      run:
        shell: sh
        working-directory: /workspace
    steps:
      - name: API Service cannot be reached from a job Pod
        run: |
          if /bin/busybox nc -z -w 3 10.43.0.1 443; then
            echo 'unexpected access to Kubernetes API Service'
            exit 1
          fi
          echo 'Kubernetes API Service egress denied'
